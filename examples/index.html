<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Flow primitives</title>
    <style>
      * { box-sizing: border-box; }
      body { max-width: 1100px; margin: 0 auto; padding: 48px 24px; color: #111; background: #f7f7f5; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 4rem); font-weight: 500; letter-spacing: -.04em; }
      p { margin: 0 0 32px; color: #555; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 24px; }
      figure { margin: 0; padding: 20px; border: 1px solid #ddd; background: #fff; }
      figcaption { margin-bottom: 12px; font-weight: 600; }
      svg { display: block; width: 100%; height: auto; }
      .chart { min-height: 320px; }
    </style>
  </head>
  <body>
    <h1>Sketch Flow primitives</h1>
    <p>Independent diagram primitives and the pinned chart.xkcd compatibility entry point.</p>
    <div class="grid">
      <figure>
        <figcaption>Sketch Flow</figcaption>
        <svg class="primitives" viewBox="0 0 520 340" role="img" aria-label="A box points to a blue decision diamond"></svg>
      </figure>
      <figure>
        <figcaption>chart.xkcd 2.0.12</figcaption>
        <svg class="chart" role="img" aria-label="Example hand-drawn bar chart"></svg>
      </figure>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
